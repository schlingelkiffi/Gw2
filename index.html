<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GW2 Achievement Helper</title>
  <meta name="description" content="Search Guild Wars 2 achievements, get a wiki-based run-through and find easy AP.">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GW2 Achievements">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">⚜ GW2 Achievement Helper</a>
    <nav>
      <a href="#/" data-nav="search">Search</a>
      <a href="#/easy" data-nav="easy">Easy AP</a>
      <a href="#/timers" data-nav="timers">Timers</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div id="account" class="account"></div>
  </header>
  <div id="status" class="status" hidden>
    <span id="status-text"></span>
    <div class="bar"><div id="status-bar"></div></div>
  </div>
  <main id="view"><p class="muted">Loading…</p></main>
  <div id="toast" class="toast" hidden></div>
  <div id="lightbox" class="lightbox" hidden onclick="this.hidden = true"></div>
  <footer>
    Data: <a href="https://wiki.guildwars2.com/wiki/API:Main" target="_blank" rel="noopener">GW2 API</a> ·
    Guides: <a href="https://wiki.guildwars2.com" target="_blank" rel="noopener">Guild Wars 2 Wiki</a> (CC BY-NC-SA 3.0).
    Unofficial fan tool – Guild Wars 2 © ArenaNet.
  </footer>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/timers.js"></script>
  <script src="js/collections.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service Worker', e));
    }
  </script>
</body>
</html>
